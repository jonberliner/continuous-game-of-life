<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <canvas id="ambient" aria-hidden="true"></canvas>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <h1 class="glitch" data-text="CONTINUOUS//LIFE">CONTINUOUS//LIFE</h1>
                <span class="brand-tag">smoothlife · color cellular automata</span>
            </div>
            <nav class="transport" id="transport" aria-label="Playback"></nav>
        </header>

        <main class="layout">
            <section class="stage" aria-label="Simulation">
                <div class="frame">
                    <span class="corner tl"></span><span class="corner tr"></span>
                    <span class="corner bl"></span><span class="corner br"></span>
                    <span class="live-tag"><i></i><b class="live-text">live</b><b class="paused-text">paused</b></span>
                    <canvas id="glCanvas"></canvas>
                </div>
                <div class="hud" id="hud" aria-live="off">MOTION ▯▯▯▯▯▯▯▯  COLOR ▯▯▯▯▯▯▯▯</div>
                <div class="keys" aria-hidden="true">
                    <span><kbd>space</kbd> pause</span>
                    <span><kbd>R</kbd> restart</span>
                    <span><kbd>M</kbd> mutate</span>
                    <span><kbd>S</kbd> snapshot</span>
                </div>
            </section>

            <aside class="panel" aria-label="Controls">
                <div class="controls-container"></div>
            </aside>
        </main>
    </div>

    <div class="dropveil" id="dropveil" aria-hidden="true">
        <div class="dropveil-inner">
            <span class="dropveil-big glitch" data-text="FEED IT">FEED IT</span>
            <span class="dropveil-small">drop an image to seed new life</span>
        </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
